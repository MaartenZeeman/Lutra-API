name: Build and Test

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Lutra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lutra.sln

      - name: Build
        run: dotnet build Lutra.sln --configuration Release --no-restore

      - name: Verify OpenAPI contract is up to date
        run: |
          git diff --exit-code -- Lutra.API/OpenApi/lutra-v1.json || {
            echo "::error::The generated OpenAPI contract is stale. Rebuild and commit Lutra.API/OpenApi/lutra-v1.json.";
            exit 1;
          }

      - name: Run Application unit tests
        run: dotnet run --project Lutra.Application.UnitTests/Lutra.Application.UnitTests.csproj --configuration Release --no-build

      - name: Run OpenRouter unit tests
        run: dotnet run --project Lutra.Infrastructure.OpenRouter.UnitTests/Lutra.Infrastructure.OpenRouter.UnitTests.csproj --configuration Release --no-build

      - name: Run API integration tests
        run: dotnet run --project Lutra.API.IntegrationTests/Lutra.API.IntegrationTests.csproj --configuration Release --no-build
